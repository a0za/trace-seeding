<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8faf8">
  <meta name="apple-mobile-web-app-title" content="TЯace">
  <title>Cell Seeding Calculator | TЯace</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./print.css">
  <script src="./ui.js" defer></script>
  <script src="./output.js" defer></script>
  <script src="./calculator.js" defer></script>
</head>
<body>
  <header class="topbar"><div class="page-width topbar-inner">
    <div class="brand"><img src="./apple-touch-icon.png" alt="" width="32" height="32"><span>TЯace</span></div>
    <nav class="languages" aria-label="Language / 言語"><button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button><button type="button" data-lang="ja" lang="ja" aria-pressed="false">日本語</button></nav>
  </div></header>
  <main class="page-width workspace">
    <h1 data-ja="細胞濃度・播種量の計算">Cell seeding calculator</h1>
    <section class="panel measurement-panel" aria-labelledby="measurement-title">
      <div class="panel-heading">
        <h2 id="measurement-title" data-ja="細胞カウント">Cell count</h2>
        <button id="reset-counts" type="button" class="quiet-button" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg>
          <span data-ja="カウントをリセット">Reset counts</span>
        </button>
      </div>
      <div class="measurement-grid">
        <div class="count-block">
          <div class="chamber" role="group" aria-labelledby="measurement-title">
            <input id="count-1" aria-label="Top left square" data-aria-ja="左上の細胞数" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next" placeholder="—">
            <input id="count-2" aria-label="Top right square" data-aria-ja="右上の細胞数" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next" placeholder="—">
            <input id="count-3" aria-label="Bottom left square" data-aria-ja="左下の細胞数" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next" placeholder="—">
            <input id="count-4" aria-label="Bottom right square" data-aria-ja="右下の細胞数" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" placeholder="—">
            <div class="chamber-center">
              <svg id="chamber-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" aria-hidden="true">
                <g fill="#d9f0e8"><rect x="1" y="1" width="35" height="35"/><rect x="72" y="1" width="35" height="35"/><rect x="1" y="72" width="35" height="35"/><rect x="72" y="72" width="35" height="35"/></g>
                <g stroke="#60a993" stroke-width=".85" fill="none">
                  <path d="M9 1v35m9-35v35m9-35v35M1 9h35M1 18h35M1 27h35"/>
                  <path transform="translate(72)" d="M9 1v35m9-35v35m9-35v35M0 9h35M0 18h35M0 27h35"/>
                  <path transform="translate(0 72)" d="M9 0v35m9-35v35m9-35v35M1 9h35M1 18h35M1 27h35"/>
                  <path transform="translate(72 72)" d="M9 0v35m9-35v35m9-35v35M0 9h35M0 18h35M0 27h35"/>
                </g>
                <path d="M43.2 36v36m7.2-36v36m7.2-36v36m7.2-36v36M36 43.2h36m-36 7.2h36m-36 7.2h36m-36 7.2h36" stroke="#adbab3" stroke-width=".7" fill="none"/>
                <path d="M1 1h106v106H1zM36 1v106m36-106v106M1 36h106M1 72h106" stroke="#4c6e61" stroke-width="1.4" fill="none"/>
              </svg>
            </div>
          </div>
          <p class="diagram-caption" data-ja="ノイバウエル計算盤 · 大区画 1 mm²、深さ 0.1 mm">Neubauer chamber · 1 mm² squares, 0.1 mm deep</p>
        </div>
        <div class="reading">
          <label class="dilution-label" for="dilution"><span data-ja="希釈倍率">Dilution factor</span>
            <span class="unit-field"><input id="dilution" inputmode="decimal" enterkeyhint="done" value="2" autocomplete="off"><span aria-hidden="true">×</span></span>
          </label>
          <div class="concentration-card">
            <p data-ja="細胞懸濁液（原液）の濃度">Stock cell concentration</p>
            <div class="reading-value"><output id="concentration">—</output><span>cells/mL</span></div>
            <p id="measurement-note"></p>
          </div>
        </div>
      </div>
    </section>
    <section class="panel destinations-panel" aria-labelledby="destinations-title">
      <div class="panel-heading"><h2 id="destinations-title" data-ja="播種先">Seeding destinations</h2></div>
      <p id="empty" class="hint" data-ja="容器を選んで、1 dish・1 wellあたりの分注量を計算します。">Choose a vessel to calculate volumes per dish or well.</p>
      <div id="vessels" class="vessels" role="group" aria-labelledby="destinations-title"></div>
      <div id="rows"></div>
    </section>
    <aside class="worksheet">
      <section class="panel stock-panel" aria-labelledby="totals-title">
        <div class="panel-heading"><h2 id="totals-title" data-ja="原液と書き出し">Stock &amp; export</h2></div>
        <div class="stock-inputs">
          <label for="date"><span data-ja="測定日">Measurement date</span><input id="date" type="date" required></label>
          <label for="available"><span data-ja="手持ちの原液（任意）">Available stock (optional)</span>
            <span class="unit-field"><input id="available" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="—"><span>mL</span></span>
          </label>
        </div>
        <dl class="totals">
          <div><dt data-ja="必要な原液の合計">Stock required</dt><dd><output id="required">—</output></dd></div>
          <div><dt data-ja="過不足">Stock balance</dt><dd><output id="balance">—</output></dd></div>
        </dl>
        <p id="total-note" class="warning" aria-live="polite"></p>
        <div class="output-actions">
          <button id="export-note" class="primary-button" type="button" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h14v10l-5 5H5zM14 19v-5h5M8 8h8M8 11h5"/></svg><span data-ja="付箋に書き出す">Save note</span></button>
          <button id="print" type="button" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7zM16 11h1"/></svg><span data-ja="印刷">Print / PDF</span></button>
        </div>
        <p id="note-status" class="hint" role="status"></p>
      </section>
      <details id="notes" class="panel notes-panel">
        <summary><span data-ja="このブラウザの付箋">Notes on this browser</span><span id="note-count">0</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></summary>
        <div id="note-list"></div>
      </details>
    </aside>
  </main>
  <div id="print-sheet" hidden></div>
</body>
</html>
