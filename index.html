<style>
:root { font: 16px/1.55 -apple-system, BlinkMacSystemFont, sans-serif; color: #183029; background: #edf1ed; }
* { box-sizing: border-box; }
body { margin: 0; }
header { background: #153b2e; color: #fff; }
.shell { max-width: 1040px; margin: auto; padding: 24px clamp(16px, 4vw, 40px); }
header .shell { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.brand { display: block; color: #c4e4d5; font-weight: 700; letter-spacing: .08em; font-size: .85rem; }
h1 { font-size: clamp(1.25rem, 4vw, 1.95rem); margin: 3px 0 0; }
main.shell { display: grid; gap: 16px; }
section { background: white; border: 1px solid #d5dfd7; border-radius: 16px; padding: clamp(14px, 3vw, 25px); min-width: 0; }
h2, h3, p { margin: 0; }
h2 { font-size: 1.1rem; margin-bottom: 8px; }
h3 { font-size: 1rem; }
.muted, label { color: #496456; font-size: .85rem; }
.fields, .measurement, .summary { display: grid; gap: 14px; }
.measurement { grid-template-columns: minmax(0, 2fr) minmax(170px, 1fr); margin-top: 12px; }
.fields { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
label { display: grid; gap: 5px; align-content: start; }
input, select, button { font: inherit; }
input, select { width: 100%; min-width: 0; color: #183029; background: #fafcf9; border: 1px solid #bdccc1; border-radius: 8px; padding: 7px 9px; }
button { cursor: pointer; border: 1px solid #b5c9bb; border-radius: 8px; background: #f2f8f3; color: #153b2e; padding: 7px 12px; white-space: nowrap; }
button:hover:not(:disabled) { background: #dfeee3; }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid #397e60; outline-offset: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.metric { padding: 12px 16px; border-radius: 10px; background: #edf5ee; }
output { font-variant-numeric: tabular-nums; }
.metric output { display: block; font-size: clamp(1.18rem, 3vw, 1.6rem); font-weight: 700; overflow-wrap: anywhere; }
#measurement-note { margin-top: 8px; }
#rows { display: grid; gap: 10px; }
article { padding: 12px; border: 1px solid #d9e3db; border-radius: 10px; break-inside: avoid; }
.card-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.row-result { display: grid; margin-top: 8px; gap: 4px; font-size: .9rem; }
.warning { color: #984b19; }
.summary { grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); align-items: start; }
@media (max-width: 560px) { .measurement { grid-template-columns: 1fr; } header .shell { align-items: start; } }
@media print {
  :root, header { background: white; color: black; }
  .brand { color: black; }
  button, .actions, #empty { display: none !important; }
  .shell { max-width: none; padding: 8px 0; }
  section { border-color: #aaa; padding: 10px; }
  input, select, .metric { background: white; color: black; }
  main.shell { gap: 10px; }
}
</style>
</head>
<body>
<header><div class="shell"><div><span class="brand">TЯace</span><h1>Cell Seeding Calculator</h1></div><button id="print" type="button" disabled>Print / PDF</button></div></header>
<main class="shell">
  <section aria-labelledby="measurement-title">
    <h2 id="measurement-title">Cell Concentration</h2>
    <p class="muted">Neubauer hemocytometer: large squares (1 mm², 0.1 mm deep)</p>
    <div class="measurement">
      <div class="counts">
        <label>Square 1<input id="count-1" inputmode="numeric" autocomplete="off"></label>
        <label>Square 2<input id="count-2" inputmode="numeric" autocomplete="off"></label>
        <label>Square 3<input id="count-3" inputmode="numeric" autocomplete="off"></label>
        <label>Square 4<input id="count-4" inputmode="numeric" autocomplete="off"></label>
      </div>
      <label>Dilution factor (×)<input id="dilution" inputmode="decimal" value="2"></label>
      <div class="metric"><p class="muted">Stock cell concentration</p><output id="concentration">—</output></div>
    </div>
    <p id="measurement-note" class="muted"></p>
  </section>
  <section aria-labelledby="destinations-title">
    <h2 id="destinations-title">Seeding Destinations</h2>
    <div id="vessels" class="actions" aria-label="Add a seeding destination"></div>
    <p id="empty" class="muted">Add a vessel to calculate the stock and medium volumes per dish or well.</p>
    <div id="rows"></div>
  </section>
  <section aria-labelledby="totals-title">
    <h2 id="totals-title">Stock Volume</h2>
    <div class="summary">
      <div class="metric"><p class="muted">Total stock required</p><output id="required">—</output></div>
      <label>Available stock (mL, optional)<input id="available" inputmode="decimal"></label>
      <div class="metric"><p class="muted">Stock balance</p><output id="balance">—</output></div>
    </div>
    <p id="total-note" class="muted"></p>
  </section>
</main>
<script>
"use strict";

const vessels = [
  { name: "35 mm dish", wells: 1, volume: 2 },
  { name: "60 mm dish", wells: 1, volume: 5 },
  { name: "100 mm dish", wells: 1, volume: 10 },
  { name: "6 well plate", wells: 6, volume: 2 },
  { name: "12 well plate", wells: 12, volume: 1 },
];
const rangeError = "A value is outside the supported calculation range.";

function parseNumber(text) {
  const trimmed = text.trim();
  if (!/^[+-]?(?:(?:[0-9]+|[0-9]{1,3}(?:,[0-9]{3})+)(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$/.test(trimmed)) return NaN;
  const value = Number(trimmed.replaceAll(",", ""));
  return Number.isFinite(value) ? value : NaN;
}

function measure(counts, dilution) {
  if (counts.length !== 4 || counts.some(text => !text.trim())) throw Error("Enter a cell count for each of the four large squares.");
  const values = counts.map(parseNumber);
  if (values.some(value => !Number.isSafeInteger(value) || value < 0)) throw Error("Enter a non-negative whole number for each square.");
  const factor = parseNumber(dilution);
  if (!(factor >= 1)) throw Error("Enter a dilution factor of at least 1.");
  const mean = values.reduce((sum, value) => sum + value, 0) / 4;
  const concentration = mean * 10000 * factor;
  if (!Number.isFinite(concentration)) throw Error(rangeError);
  return { mean, factor, concentration };
}

function difference(lhs, rhs) {
  const delta = lhs - rhs;
  const exponent = Math.floor(Math.log2(Math.max(Math.abs(lhs), Math.abs(rhs))));
  const ulp = Math.max(Number.MIN_VALUE, 2 ** (exponent - 52));
  return Math.abs(delta) <= 4 * ulp ? 0 : delta;
}

function calculate(vessel, inputs, concentration) {
  const count = parseNumber(inputs.count);
  if (!Number.isSafeInteger(count) || count < 1) throw Error("Enter a whole number of vessels (at least 1).");
  const wells = Number(inputs.wells);
  if (!Number.isInteger(wells) || wells < 1 || wells > vessel.wells) throw Error("Choose a number of wells within the plate capacity.");
  const target = parseNumber(inputs.target);
  if (!Number.isSafeInteger(target) || target < 1) throw Error("Enter a positive whole number of target cells per dish or well.");
  const final = parseNumber(inputs.final);
  if (!(final > 0)) throw Error("Enter a final volume greater than 0 mL.");
  if (!(concentration > 0)) throw Error("Stock concentration must be greater than zero to calculate the seeding volume.");
  const units = count * wells;
  const stock = target / concentration;
  const stockTotal = stock * units;
  const finalTotal = final * units;
  if (!Number.isSafeInteger(units) || !(stock > 0) || !Number.isFinite(stockTotal) || !Number.isFinite(finalTotal)) throw Error(rangeError);
  return { units, stock, stockTotal, finalTotal, medium: difference(final, stock) };
}

const normal = new Intl.NumberFormat("en-US", { maximumSignificantDigits: 6 });
const scientific = new Intl.NumberFormat("en-US", { notation: "scientific", maximumSignificantDigits: 6 });
const display = value => (value !== 0 && (Math.abs(value) < 0.0001 || Math.abs(value) >= 1e10) ? scientific : normal).format(value);
const volume = ml => ml > 0 && ml < 1 ? display(ml * 1000) + " µL" : display(ml) + " mL";
const mix = (stock, medium) => "Stock " + volume(stock) + (medium < 0 ? "" : " + medium " + volume(medium));

const byId = id => document.getElementById(id);
const counts = [1, 2, 3, 4].map(index => byId("count-" + index));
const rows = new Map();
const print = byId("print");

function addDestination(vessel, addButton) {
  const card = document.createElement("article");
  const unit = vessel.wells === 1 ? "dish" : "well";
  card.innerHTML = `
    <div class="card-title"><h3>${vessel.name}</h3><button type="button" aria-label="Remove ${vessel.name} destination">Remove</button></div>
    <div class="fields">
      <label>Target (cells/${unit})<input name="target" placeholder="1e5"></label>
      <label>Number of vessels<input name="count" inputmode="numeric" value="1"></label>
      ${vessel.wells > 1 ? '<label>Wells used per plate<select name="wells"></select></label>' : ""}
      <label>Final volume (mL/${unit})<input name="final" inputmode="decimal" value="${vessel.volume}"></label>
    </div>
    <output class="row-result"></output>`;
  const cl = name => card.querySelector('[name="' + name + '"]');
  const target = cl("target");
  const wells = cl("wells");
  if (wells) {
    for (let value = 1; value <= vessel.wells; value++) wells.add(new Option(value, value));
    wells.value = String(vessel.wells);
  }
  const count = cl("count");
  const final = cl("final");
  rows.set(card, {
    vessel, unit, result: card.querySelector("output"),
    read: () => ({ target: target.value, count: count.value, wells: wells?.value ?? "1", final: final.value }),
  });
  card.querySelector("button").addEventListener("click", () => {
    rows.delete(card);
    card.remove();
    refresh();
    addButton.focus();
  });
  byId("rows").append(card);
  refresh();
  target.focus();
}

function describe(result, text, warning = false) {
  const line = document.createElement("span");
  line.textContent = text;
  if (warning) line.className = "warning";
  result.append(line);
}

function refresh() {
  byId("empty").hidden = rows.size > 0;
  let measurement;
  try {
    measurement = measure(counts.map(input => input.value), byId("dilution").value);
    byId("concentration").textContent = display(measurement.concentration) + " cells/mL";
    byId("measurement-note").textContent = `Mean ${display(measurement.mean)} × dilution factor ${display(measurement.factor)} × 10,000`;
  } catch (error) {
    byId("concentration").textContent = "—";
    byId("measurement-note").textContent = error.message;
  }

  let valid = Boolean(measurement);
  let required = 0;
  let finalTotal = 0;
  for (const row of rows.values()) {
    row.result.replaceChildren();
    if (!measurement) continue;
    try {
      const line = calculate(row.vessel, row.read(), measurement.concentration);
      required += line.stockTotal;
      finalTotal += line.finalTotal;
      describe(row.result, `Per ${row.unit}: ${mix(line.stock, line.medium)}`);
      if (line.units > 1) describe(row.result, `Total for ${display(line.units)} ${row.unit === "dish" ? "dishes" : "wells"}: ${mix(line.stockTotal, line.medium * line.units)}`);
      if (line.medium < 0) describe(row.result, "The required stock volume exceeds the final volume.", true);
    } catch (error) {
      valid = false;
      describe(row.result, error.message);
    }
  }

  let note = "";
  const rawAvailable = byId("available").value;
  const available = rawAvailable.trim() ? parseNumber(rawAvailable) : null;
  if (available !== null && !(available >= 0)) {
    note = "Enter the available stock volume as a non-negative number in mL.";
    valid = false;
  } else if (!Number.isFinite(required) || !Number.isFinite(finalTotal)) {
    note = rangeError;
    valid = false;
  } else if (!valid && measurement && rows.size) {
    note = "Check the inputs for each seeding destination.";
  }
  const showTotal = valid && rows.size > 0;
  byId("required").textContent = showTotal ? volume(required) : "—";
  const balance = showTotal && available !== null ? difference(available, required) : null;
  byId("balance").textContent = balance === null ? "—" : balance === 0 ? "Exactly enough" :
    (balance < 0 ? "Short by " : "Remaining: ") + volume(Math.abs(balance));
  byId("balance").classList.toggle("warning", balance < 0);
  byId("total-note").textContent = note;
  print.disabled = !valid;
}

for (const vessel of vessels) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "+ " + vessel.name;
  button.addEventListener("click", () => addDestination(vessel, button));
  byId("vessels").append(button);
}
document.querySelector("main").addEventListener("input", refresh);
print.addEventListener("click", () => window.print());
refresh();
</script>
</body>
</html>
